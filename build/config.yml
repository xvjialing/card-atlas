version: '3'
info:
  companyName: "CardAtlas"
  productName: "CardAtlas"
  productIdentifier: "local.cardatlas.desktop"
  description: "相机素材分析与归档"
  copyright: "2026 CardAtlas"
  comments: "照片与视频本地归档"
  version: "0.1.0"
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore, .gitkeep, "*_test.go"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
